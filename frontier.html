<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>灰烬边境：星陨纪事</title>
  <link rel="stylesheet" href="assets/game.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand"><img class="brand-symbol" src="assets/ashen-mark.svg" alt=""><div class="brand-mark">ASHEN MARCH <span>·</span> CHRONICLES</div><h1>灰烬边境</h1><p>王国的地图尚未画完。每一步都可能改写边境的传说。</p></div>
      <div class="portrait" id="characterCard"></div>
      <div class="currency" id="currency"></div>
      <nav class="nav" id="nav">
        <button class="active" data-screen="adventure"><span>✧</span>冒险</button>
        <button data-screen="inventory"><span>▣</span>背包与装备</button>
        <button data-screen="journal"><span>≡</span>任务日志</button>
        <button data-screen="party"><span>♜</span>队伍与职业</button>
        <button data-screen="crafting"><span>⌘</span>锻造与图纸</button>
        <button data-screen="codex"><span>⌘</span>世界图鉴</button>
        <button data-screen="settings"><span>⚙</span>设置与存档</button>
      </nav>
      <div class="rail-foot"><button class="quiet-btn" data-action="rest">在营地休息</button><button class="quiet-btn" data-action="potion">快速使用药剂</button></div>
    </aside>
    <main class="main">
      <header class="topline"><div class="crumb"><span>灰烬纪元</span>　/　<b id="crumb">冒险</b></div><div class="top-actions"><span class="tag" id="clock">第 1 日 · 清晨</span><button class="icon-btn" data-screen="settings">保存状态</button></div></header>
      <section class="screen active" id="screen-adventure"></section>
      <section class="screen" id="screen-inventory"></section>
      <section class="screen" id="screen-journal"></section>
      <section class="screen" id="screen-party"></section>
      <section class="screen" id="screen-crafting"></section>
      <section class="screen" id="screen-codex"></section>
      <section class="screen" id="screen-settings"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true"><div class="modal" id="modalContent"></div></div>
  <div class="toast" id="toast"></div>
  <script src="js/building-system.js" defer></script>
  <script src="js/crafting-system.js" defer></script>
  <script src="js/skill-tree.js" defer></script>
  <script src="js/pixel-world.js" defer></script>
  <script src="js/circle-map.js" defer></script>
  <script src="js/npc-system.js" defer></script>
  <script src="js/game.js" defer></script>
</body>
</html>
